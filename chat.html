<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI - ChatMe</title>
  <style>
    :root {
      --bg-color: #0b0f0d;
      --card-bg: #161c18;
      --accent-green: #25d366;
      --text-main: #ffffff;
      --text-muted: #8696a0;
      --bubble-incoming: #1f2c24;
      --bubble-outgoing: #005c4b;
      --border-color: #202c33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Chat Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      color: var(--accent-green);
      font-size: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2a3942;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .chat-user-info h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .chat-user-info p {
      font-size: 12px;
      color: var(--accent-green);
    }

    /* Message Area */
    .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
    }

    .message.incoming {
      background: var(--bubble-incoming);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.outgoing {
      background: var(--bubble-outgoing);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .timestamp {
      font-size: 10px;
      color: var(--text-muted);
      float: right;
      margin-left: 10px;
      margin-top: 4px;
    }

    /* Input Bar */
    .input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
    }

    .input-field {
      flex: 1;
      background: #0b0f0d;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
    }

    .send-btn {
      background: var(--accent-green);
      border: none;
      color: #000;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Chat Header -->
  <header>
    <div class="header-left">
      <a href="index.html" class="back-btn">&larr;</a>
      <div class="chat-avatar">✨</div>
      <div class="chat-user-info">
        <h3>Gemini AI ⚙️</h3>
        <p>Online</p>
      </div>
    </div>
  </header>

  <!-- Chat Messages -->
  <main class="chat-body">
    <div class="message incoming">
      Hey! How is the ChatMe UI build coming along?
      <span class="timestamp">10:14 AM</span>
    </div>

    <div class="message outgoing">
      It's going great! The index, settings, and chat screens are ready.
      <span class="timestamp">10:15 AM</span>
    </div>

    <div class="message incoming">
      Awesome! Ready to upload `chat.html` to GitHub!
      <span class="timestamp">10:16 AM</span>
    </div>
  </main>

  <!-- Input Bar -->
  <div class="input-bar">
    <input type="text" class="input-field" placeholder="Type a message...">
    <button class="send-btn">&#10148;</button>
  </div>

</body>
</html>
