<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatMe</title>
  <style>
    :root {
      --bg-color: #0b0f0d;
      --card-bg: #161c18;
      --accent-green: #25d366;
      --text-main: #ffffff;
      --text-muted: #8696a0;
      --chip-active: #1f3a2b;
      --border-color: #202c33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top App Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: none;
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    .icon-btn.primary {
      background: var(--accent-green);
      color: #000;
    }

    /* Category Chips */
    .chips-container {
      display: flex;
      gap: 8px;
      padding: 0 16px 12px 16px;
      overflow-x: auto;
    }

    .chip {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--chip-active);
      color: var(--accent-green);
      border-color: var(--accent-green);
      font-weight: 600;
    }

    /* Chat List */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
    }

    .chat-item-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #2a3942;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
      object-fit: cover;
    }

    .chat-details {
      flex: 1;
      min-width: 0;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .chat-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .chat-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-message {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }

    .badge {
      background: var(--accent-green);
      color: #000;
      font-size: 11px;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bottom Navigation Bar */
    nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: var(--card-bg);
      padding: 10px 0;
      border-top: 1px solid var(--border-color);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 11px;
      text-decoration: none;
      position: relative;
    }

    .nav-item.active {
      color: var(--accent-green);
    }

    .nav-icon {
      font-size: 20px;
    }

    .nav-badge {
      position: absolute;
      top: -2px;
      right: 12px;
      background: var(--accent-green);
      color: #000;
      font-size: 10px;
      font-weight: bold;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header>
    <div class="brand">💬 ChatMe</div>
    <div class="header-actions">
      <button class="icon-btn">📷</button>

  <!-- Category Filter Chips -->
  <div class="chips-container">

  <!-- Chat List Items -->
  <main class="chat-list">

          </div>
        </div>
      </div>
    </a>

    <div class="chat-item">
      <div class="avatar">👤</div>
      <div class="chat-details">
        <div class="chat-top">
          <span class="chat-name">Toxic Vern</span>

        </div>
        <div class="chat-bottom">
          <span class="chat-message">You, mo!</span>
          <span class="badge">2</span>
        </div>
      </div>
    </div>

    <div class="chat-item">
      <div class="avatar">⚙️</div>
      <div class="chat-details">
        <div class="chat-top">
          <span class="chat-name">Half-Life</span>
          <span class="chat-time">2:05 AM</span>
        </div>
        <div class="chat-bottom">
          <span class="chat-message">Hey browe wesvar of Half-Life ...</span>
          <span class="badge">5</span>
        </div>
      </div>
    </div>

    <div class="chat-item">
      <div class="avatar">🎵</div>
      <div class="chat-details">
        <div class="chat-top">
          <span class="chat-name">Musiq Lover</span>
          <span class="chat-time">7:55 AM</span>
        </div>
        <div class="chat-bottom">
          <span class="chat-message">Hello me we se song</span>
          <span class="badge">3</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Navigation Bar -->
  <nav>
    <a href="#" class="nav-item">
      <span class="nav-icon">🌀</span>
      <span>Updates</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">📞</span>
      <span>Calls</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">👥</span>
      <span>Community</span>
    </a>
    <a href="index.html" class="nav-item active">
      <span class="nav-icon">💬</span>
      <span class="nav-badge">3</span>
      <span>Chats</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>You</span>
    </a>
  </nav>

</body>
</html>
